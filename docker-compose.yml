services:
  app:
    build: .
    image: derivative-monthly-pricing:latest
    ports:
      - "8501:8501"
    environment:
      # Optional — enables self-service onboarding of brand-new brokers.
      # The app works fully without it. Provide via the host environment or a
      # secrets manager; do NOT hard-code it here.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Kill switch for the AI onboarding path. Unset/empty = enabled. Set to
      # "false" to turn the model off entirely (deterministic parsing of known
      # brokers is unaffected; unknown formats then require a hand-authored spec).
      - AI_ONBOARDING_ENABLED=${AI_ONBOARDING_ENABLED:-}
      # Spend cap (USD) for the AI onboarding path -- a second, automatic kill
      # switch. Once cumulative recorded spend reaches this, drafting is refused
      # until the cap is raised. Unset/blank/<=0 = no cap. Enforced server-side
      # in the backend; it is deliberately NOT a UI setting, so a browser user
      # cannot raise it. Set it here (from the host env / secrets manager).
      - AI_ONBOARDING_BUDGET_USD=${AI_ONBOARDING_BUDGET_USD:-}
      # Optional — a folder of statements to pre-load into the combined view.
      # If you mount a volume below, set this to its container path.
      - STATEMENTS_DIR=${STATEMENTS_DIR:-}
      # Optional — Bloomberg Data License (HAPI) credentials, needed only to
      # run the month-end market-data snapshot (index prices + FX). Supply via
      # the host environment or a secrets manager; never hard-code here.
      - BLOOMBERG_HAPI_CLIENT_ID=${BLOOMBERG_HAPI_CLIENT_ID:-}
      - BLOOMBERG_HAPI_CLIENT_SECRET=${BLOOMBERG_HAPI_CLIENT_SECRET:-}
      - BLOOMBERG_HAPI_CATALOG=${BLOOMBERG_HAPI_CATALOG:-}
    # Optional: mount a host folder of broker statements (read-only) and set
    # STATEMENTS_DIR=/data/statements to pre-load instead of uploading.
    # volumes:
    #   - ./statements:/data/statements:ro
    restart: unless-stopped
