[project]
name = "derivative-monthly-pricing"
version = "0.1.0"
description = "Month-end derivative pricing automation platform: broker statement ingestion, MTM reconciliation, canonical live-trades output"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "xlrd>=1.2,<2.0",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
ui = [
    "streamlit>=1.36",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/derivative_pricing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:Workbook contains no default style:UserWarning",
]